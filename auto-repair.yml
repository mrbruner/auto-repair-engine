name: 🤖 Autonomous Code Repair Engine

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI", "Test Suite", "Build"]
    types:
      - completed

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  auto-fix:
    name: ⚡ Execute Autonomous Patch Engine
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: 🚀 Checkout Target Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set Up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Required Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai PyGithub requests

      - name: 🛠️ Execute Autonomous Repair Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id || github.run_id }}
        run: |
          python scripts/auto_repair.py
